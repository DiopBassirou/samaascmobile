name: Deploy Frontend PWA

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web (PWA)
        run: flutter build web --release --pwa-strategy=offline-first

      - name: Compress Build
        run: tar -czvf web.tar.gz -C build/web .

      - name: Copy Tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "web.tar.gz"
          target: "/tmp"

      - name: Extract on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p /opt/sama_asc/sama_asc_mobile/build/web
            tar -xzvf /tmp/web.tar.gz -C /opt/sama_asc/sama_asc_mobile/build/web
            rm /tmp/web.tar.gz
